<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squishy English Club - Revisão 4º Ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SQUISHY ENGLISH CLUB - Revisão de Inglês 4º ano
   Tema: Squishies + Disney + Aranhaverso + KATSEYE
   ============================================================ */

:root{
  --pink:#ff9fcf;      --pink-soft:#ffe1f1;   --pink-deep:#e5569b;
  --blue:#8fd3ff;      --blue-soft:#dcf1ff;   --blue-deep:#2f7fc4;
  --lilac:#c9b1ff;     --lilac-soft:#ece2ff;  --lilac-deep:#7a53d6;
  --mint:#9ef0c8;      --mint-soft:#ddfcec;   --mint-deep:#1f9c6a;
  --butter:#ffe694;    --butter-soft:#fff6d9; --butter-deep:#c79206;
  --coral:#ff9d8a;     --coral-deep:#e2573c;
  --ink:#4a3b52;       --ink-soft:#7b6a84;
  --white:#fffdfe;
  --shadow:0 10px 0 rgba(122,83,214,.18), 0 16px 30px rgba(122,83,214,.16);
  --shadow-sm:0 6px 0 rgba(122,83,214,.14), 0 10px 18px rgba(122,83,214,.12);
  --radius:28px;
  --font-fun:'Baloo 2','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

html,body{margin:0; padding:0; min-height:100%; overflow-x:hidden; max-width:100%;}

body{
  font-family:var(--font-body);
  color:var(--ink);
  background:
    radial-gradient(1100px 700px at 8% -5%, #ffe8f5 0%, rgba(255,232,245,0) 60%),
    radial-gradient(900px 650px at 102% 8%, #dff0ff 0%, rgba(223,240,255,0) 58%),
    radial-gradient(900px 700px at 50% 108%, #e9e1ff 0%, rgba(233,225,255,0) 62%),
    linear-gradient(160deg,#fff7fc 0%, #f4f9ff 45%, #fdf4ff 100%);
  background-attachment:fixed;
  overflow-x:hidden;
  padding-bottom:40px;
}

/* --- bolhas decorativas de fundo --- */
.blob{position:fixed; border-radius:50%; filter:blur(6px); opacity:.35; pointer-events:none; z-index:0;
  animation:floaty 9s ease-in-out infinite;}
.blob.b1{width:150px;height:150px;background:var(--pink);top:12%;left:-50px;}
.blob.b2{width:110px;height:110px;background:var(--blue);top:62%;right:-36px;animation-delay:-3s;}
.blob.b3{width:90px;height:90px;background:var(--butter);top:34%;right:7%;animation-delay:-5s;}
.blob.b4{width:120px;height:120px;background:var(--mint);bottom:6%;left:9%;animation-delay:-7s;}
@keyframes floaty{
  0%,100%{transform:translateY(0) scale(1);}
  50%{transform:translateY(-26px) scale(1.07);}
}

.wrap{position:relative; z-index:2; max-width:860px; margin:0 auto; padding:18px 16px 0;}

/* ============ SQUISH FÍSICA (squash & stretch) ============ */
@keyframes squishPress{
  0%{transform:scale(1,1);}
  28%{transform:scale(1.16,.80) translateY(5px);}
  55%{transform:scale(.93,1.10) translateY(-4px);}
  78%{transform:scale(1.05,.96) translateY(1px);}
  100%{transform:scale(1,1);}
}
@keyframes squishBig{
  0%{transform:scale(1,1) rotate(0deg);}
  22%{transform:scale(1.30,.70) rotate(-2deg) translateY(8px);}
  48%{transform:scale(.84,1.20) rotate(2deg) translateY(-8px);}
  70%{transform:scale(1.10,.92) rotate(-1deg);}
  86%{transform:scale(.97,1.03) rotate(0deg);}
  100%{transform:scale(1,1) rotate(0deg);}
}
@keyframes jellyWiggle{
  0%,100%{transform:rotate(0deg) scale(1,1);}
  25%{transform:rotate(-3deg) scale(1.03,.97);}
  75%{transform:rotate(3deg) scale(.97,1.03);}
}
@keyframes shakeNo{
  0%,100%{transform:translateX(0) scale(1,1);}
  20%{transform:translateX(-9px) scale(1.04,.96);}
  40%{transform:translateX(8px) scale(.97,1.03);}
  60%{transform:translateX(-6px) scale(1.03,.97);}
  80%{transform:translateX(4px);}
}
@keyframes popIn{
  0%{transform:scale(.4) translateY(26px); opacity:0;}
  60%{transform:scale(1.10) translateY(-6px); opacity:1;}
  100%{transform:scale(1) translateY(0); opacity:1;}
}
@keyframes bounceSoft{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-8px);}
}
@keyframes sparkleSpin{
  0%{transform:rotate(0deg) scale(.9); opacity:.7;}
  50%{transform:rotate(180deg) scale(1.15); opacity:1;}
  100%{transform:rotate(360deg) scale(.9); opacity:.7;}
}
@keyframes slideUpFade{
  from{opacity:0; transform:translateY(16px);}
  to{opacity:1; transform:translateY(0);}
}

.is-squishing{animation:squishPress .34s cubic-bezier(.34,1.56,.64,1) both;}
.is-squishing-big{animation:squishBig .62s cubic-bezier(.34,1.56,.64,1) both;}

/* ============ BOTÕES SQUISHY ============ */
.sq{
  font-family:var(--font-fun); font-weight:700; cursor:pointer;
  border:4px solid var(--white); border-radius:22px;
  padding:14px 24px; font-size:1.05rem; color:var(--ink);
  background:linear-gradient(180deg,#ffffff 0%, var(--pink-soft) 100%);
  box-shadow:var(--shadow-sm);
  transition:box-shadow .18s ease, filter .18s ease;
  transform-origin:center bottom;
  user-select:none;
}
.sq:hover{filter:brightness(1.04);}
.sq:focus-visible{outline:4px dashed var(--lilac-deep); outline-offset:3px;}
.sq.primary{background:linear-gradient(180deg,#ffb7dc 0%, #ff86c2 100%); color:#5c1d40;
  box-shadow:0 8px 0 #e5569b, 0 14px 22px rgba(229,86,155,.32);}
.sq.blue{background:linear-gradient(180deg,#aee2ff 0%, #76c9ff 100%); color:#143f63;
  box-shadow:0 8px 0 #2f7fc4, 0 14px 22px rgba(47,127,196,.3);}
.sq.mint{background:linear-gradient(180deg,#b7f6d8 0%, #7eeab6 100%); color:#0c5c3d;
  box-shadow:0 8px 0 #1f9c6a, 0 14px 22px rgba(31,156,106,.28);}
.sq.lilac{background:linear-gradient(180deg,#ddcbff 0%, #bda2ff 100%); color:#3c1f78;
  box-shadow:0 8px 0 #7a53d6, 0 14px 22px rgba(122,83,214,.3);}
.sq.butter{background:linear-gradient(180deg,#fff0bb 0%, #ffdf84 100%); color:#6b4a02;
  box-shadow:0 8px 0 #d9a310, 0 14px 22px rgba(217,163,16,.28);}
.sq.ghost{background:rgba(255,255,255,.8); color:var(--ink-soft); box-shadow:var(--shadow-sm);}
.sq.big{font-size:1.3rem; padding:18px 36px; border-radius:26px;}
.sq[disabled]{opacity:.5; cursor:not-allowed; filter:grayscale(.3);}

/* ============ CARTÕES ============ */
.card{
  background:rgba(255,255,255,.88);
  border:5px solid var(--white);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px;
  backdrop-filter:blur(4px);
  animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both;
  transform-origin:center bottom;
}

/* ============ CABEÇALHO ============ */
.topbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
.logo{
  font-family:var(--font-fun); font-weight:800; font-size:1.5rem; line-height:1.05;
  background:linear-gradient(95deg,#e5569b,#7a53d6 45%,#2f7fc4);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  letter-spacing:.2px;
}
.logo small{display:block; font-family:var(--font-body); font-size:.68rem; font-weight:700;
  color:var(--ink-soft); -webkit-text-fill-color:var(--ink-soft); letter-spacing:.6px; text-transform:uppercase;}
.topbar .spacer{flex:1 1 auto;}
.pill{
  font-family:var(--font-fun); font-weight:700; font-size:.92rem;
  background:var(--white); border:3px solid var(--butter); color:var(--ink);
  border-radius:999px; padding:7px 15px; box-shadow:0 4px 0 rgba(217,163,16,.3);
  display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
}
.pill.p-blue{border-color:var(--blue); box-shadow:0 4px 0 rgba(47,127,196,.28);}
.pill.p-pink{border-color:var(--pink); box-shadow:0 4px 0 rgba(229,86,155,.28);}

.gear{
  width:42px; height:42px; border-radius:50%; border:3px solid rgba(255,255,255,.9);
  background:rgba(255,255,255,.55); cursor:pointer; font-size:1.1rem; line-height:1;
  display:grid; place-items:center; color:var(--ink-soft); opacity:.55;
  box-shadow:0 4px 0 rgba(122,83,214,.14); transition:opacity .2s ease, transform .2s ease;
  transform-origin:center;
}
.gear:hover{opacity:1; transform:rotate(45deg);}

/* ============ BARRA DE PROGRESSO ============ */
.progress-shell{
  height:24px; border-radius:999px; background:var(--white);
  border:4px solid var(--white); box-shadow:inset 0 3px 8px rgba(122,83,214,.16);
  overflow:hidden; margin:6px 0 4px;
}
.progress-fill{
  height:100%; width:0%; border-radius:999px;
  background:linear-gradient(90deg,#ffb7dc,#c9b1ff 50%,#8fd3ff);
  background-size:200% 100%;
  transition:width .55s cubic-bezier(.34,1.56,.64,1);
  animation:shimmer 3s linear infinite;
}
@keyframes shimmer{0%{background-position:0% 0;}100%{background-position:200% 0;}}
.progress-label{font-size:.78rem; font-weight:800; color:var(--ink-soft); text-align:right; letter-spacing:.4px;}

/* ============ TELA DE BOAS-VINDAS ============ */
.welcome{text-align:center; padding:26px 20px 30px;}
.welcome h1{font-family:var(--font-fun); font-size:2.1rem; margin:8px 0 4px; line-height:1.12;
  background:linear-gradient(95deg,#e5569b,#7a53d6 50%,#2f7fc4);
  -webkit-background-clip:text; background-clip:text; color:transparent;}
.welcome p.sub{margin:0 auto 18px; max-width:460px; font-weight:600; color:var(--ink-soft); font-size:1rem;}
.hero-row{display:flex; justify-content:center; gap:6px; flex-wrap:wrap; margin:10px 0 18px;}
.hero-row .squishy-mini{animation:bounceSoft 2.6s ease-in-out infinite;}
.hero-row .squishy-mini:nth-child(2){animation-delay:.25s;}
.hero-row .squishy-mini:nth-child(3){animation-delay:.5s;}
.hero-row .squishy-mini:nth-child(4){animation-delay:.75s;}
.hero-row .squishy-mini:nth-child(5){animation-delay:1s;}

.name-field{
  font-family:var(--font-fun); font-size:1.25rem; text-align:center; font-weight:700;
  padding:14px 18px; border-radius:22px; border:4px solid var(--lilac);
  background:var(--white); color:var(--ink); width:min(330px,100%);
  box-shadow:inset 0 3px 8px rgba(122,83,214,.12); outline:none;
}
.name-field:focus{border-color:var(--pink); box-shadow:inset 0 3px 8px rgba(229,86,155,.16), 0 0 0 5px rgba(255,159,207,.25);}
.name-field::placeholder{color:#c3b6cb; font-weight:600;}

.badge-row{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:20px;}
.badge{font-size:.76rem; font-weight:800; padding:6px 12px; border-radius:999px;
  background:var(--white); border:2px solid var(--lilac-soft); color:var(--ink-soft);}

/* ============ MAPA / FASES ============ */
.phase-grid{display:grid; gap:14px; margin-top:4px;}
.phase{
  display:flex; align-items:center; gap:14px; text-align:left;
  padding:16px; border-radius:26px; border:5px solid var(--white); cursor:pointer;
  box-shadow:var(--shadow-sm); transform-origin:center bottom;
  transition:filter .2s ease;
}
.phase:hover{filter:brightness(1.03);}
.phase.p1{background:linear-gradient(135deg,#ddfcec 0%, #c5f3ff 100%);}
.phase.p2{background:linear-gradient(135deg,#ffe1f1 0%, #ece2ff 100%);}
.phase.p3{background:linear-gradient(135deg,#fff6d9 0%, #ffe1f1 100%);}
.phase.locked{filter:grayscale(.68) brightness(.97); cursor:not-allowed; opacity:.8;}
.phase .emoji{font-size:2.3rem; width:58px; height:58px; display:grid; place-items:center;
  background:rgba(255,255,255,.75); border-radius:20px; flex:0 0 auto; box-shadow:0 4px 0 rgba(122,83,214,.12);}
.phase .info{flex:1 1 auto; min-width:0;}
.phase .info h3{font-family:var(--font-fun); margin:0 0 2px; font-size:1.18rem; line-height:1.15;}
.phase .info p{margin:0; font-size:.84rem; font-weight:700; color:var(--ink-soft);}
.phase .state{font-family:var(--font-fun); font-weight:800; font-size:.86rem; text-align:center;
  background:var(--white); border-radius:999px; padding:6px 12px; flex:0 0 auto; color:var(--ink-soft);
  box-shadow:0 3px 0 rgba(122,83,214,.12);}
.phase .state.done{color:var(--mint-deep); border:2px solid var(--mint);}

/* ============ PRATELEIRA DE SQUISHIES ============ */
.shelf-box{margin-top:16px;}
.shelf-title{display:flex; align-items:center; gap:8px; margin:0 0 10px;
  font-family:var(--font-fun); font-size:1.15rem;}
.shelf-title .count{font-size:.8rem; font-weight:800; color:var(--ink-soft);
  background:var(--white); border-radius:999px; padding:4px 10px; border:2px solid var(--lilac-soft);}
.shelf{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:10px;
  padding:14px 12px 16px; border-radius:22px;
  background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,246,217,.6));
  border:4px dashed rgba(201,177,255,.55);
}
.shelf-item{
  display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;
  background:var(--white); border-radius:18px; padding:8px 4px 6px; border:3px solid var(--white);
  box-shadow:0 5px 0 rgba(122,83,214,.12); transform-origin:center bottom;
  transition:border-color .2s ease;
}
.shelf-item:hover{border-color:var(--pink);}
.shelf-item .svgbox{width:52px; height:52px; display:grid; place-items:center;}
.shelf-item .svgbox svg{width:100%; height:100%; display:block;}
.shelf-item .nm{font-size:.62rem; font-weight:800; text-align:center; line-height:1.1; color:var(--ink-soft);}
.shelf-item.locked{opacity:.45; filter:grayscale(1); cursor:default; box-shadow:none; border-style:dashed; border-color:#ddd3e4;}
.shelf-item.locked .svgbox{opacity:.35;}
.shelf-item.fresh{animation:popIn .6s cubic-bezier(.34,1.56,.64,1) both;}
.squishy-mini{width:60px;height:60px;}
.squishy-mini svg{width:100%;height:100%;}

/* ============ QUIZ ============ */
.qhead{display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap;}
.qtag{font-family:var(--font-fun); font-weight:800; font-size:.76rem; letter-spacing:.5px;
  text-transform:uppercase; padding:5px 12px; border-radius:999px; background:var(--lilac-soft); color:var(--lilac-deep);}
.qtag.t-voc8{background:var(--mint-soft); color:var(--mint-deep);}
.qtag.t-fable{background:var(--blue-soft); color:var(--blue-deep);}
.qtag.t-gram{background:var(--pink-soft); color:var(--pink-deep);}
.qtag.t-voc9{background:var(--butter-soft); color:var(--butter-deep);}
.qnum{margin-left:auto; font-weight:800; font-size:.82rem; color:var(--ink-soft);}

.scene{
  display:flex; gap:12px; align-items:center; padding:12px 14px; border-radius:20px;
  background:linear-gradient(135deg, rgba(236,226,255,.75), rgba(220,241,255,.75));
  border:3px solid var(--white); margin-bottom:14px;
}
.scene .av{font-size:2rem; flex:0 0 auto; animation:jellyWiggle 3.4s ease-in-out infinite;}
.scene .txt{font-weight:700; font-size:.94rem; color:var(--ink);}

.question{font-family:var(--font-fun); font-size:1.26rem; font-weight:700; line-height:1.3; margin:0 0 14px;}
.question .en{color:var(--lilac-deep);}

.story{
  background:linear-gradient(180deg,#fffdf6,#fff6d9);
  border:4px solid var(--white); border-left:10px solid var(--butter);
  border-radius:20px; padding:16px 18px; margin-bottom:16px;
  box-shadow:var(--shadow-sm);
  font-size:.97rem; line-height:1.62;
}
.story h4{font-family:var(--font-fun); margin:0 0 8px; font-size:1.2rem; color:var(--butter-deep);}
.story p{margin:0 0 9px;}
.story p:last-child{margin-bottom:0;}
.story b{color:var(--pink-deep);}
.story .glossary{margin-top:12px; padding-top:10px; border-top:2px dashed rgba(199,146,6,.3);
  font-size:.8rem; font-weight:700; color:var(--ink-soft);}

.options{display:grid; gap:10px;}
.opt{
  display:flex; align-items:center; gap:11px; text-align:left; width:100%;
  font-family:var(--font-body); font-weight:700; font-size:1.02rem; color:var(--ink);
  background:var(--white); border:4px solid #f0e7f7; border-radius:20px; padding:13px 15px;
  cursor:pointer; box-shadow:0 5px 0 rgba(122,83,214,.12); transform-origin:center bottom;
  transition:border-color .18s ease, background .18s ease;
}
.opt:hover:not([disabled]){border-color:var(--lilac); background:#fdfaff;}
.opt .key{
  flex:0 0 auto; width:32px; height:32px; border-radius:12px; display:grid; place-items:center;
  font-family:var(--font-fun); font-weight:800; background:var(--lilac-soft); color:var(--lilac-deep); font-size:.95rem;
}
.opt .lbl{flex:1 1 auto;}
.opt .lbl .pt{display:block; font-size:.76rem; font-weight:700; color:var(--ink-soft);}
.opt.correct{border-color:var(--mint); background:var(--mint-soft); box-shadow:0 5px 0 rgba(31,156,106,.3);}
.opt.correct .key{background:var(--mint); color:#0c5c3d;}
.opt.wrong{border-color:var(--coral); background:#ffeae5; box-shadow:0 5px 0 rgba(226,87,60,.28);
  animation:shakeNo .45s ease both;}
.opt.wrong .key{background:var(--coral); color:#6d2010;}
.opt.picked{border-color:var(--pink); background:var(--pink-soft); box-shadow:0 5px 0 rgba(229,86,155,.28);}
.opt.picked .key{background:var(--pink); color:#5c1d40;}
.opt.faded{opacity:.5;}
.opt[disabled]{cursor:default;}

/* grade de roupas / multi-seleção */
.options.grid2{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.opt.chip{flex-direction:column; text-align:center; gap:4px; padding:14px 10px;}
.opt.chip .ico{font-size:1.9rem; line-height:1;}
.opt.chip .lbl{font-size:1rem;}
.opt.chip .key{display:none;}
.opt.chip .check{position:absolute;}
.opt.chip.picked::after{content:'✓'; position:absolute; top:6px; right:10px; font-weight:900; color:var(--pink-deep);}
.opt.chip.correct::after{content:'✓'; position:absolute; top:6px; right:10px; font-weight:900; color:var(--mint-deep);}
.opt.chip{position:relative;}

/* ============ MATCH (ligar colunas) ============ */
.match-wrap{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.match-col{display:grid; gap:9px; align-content:start;}
.match-col h5{font-family:var(--font-fun); margin:0 0 2px; font-size:.9rem; color:var(--ink-soft); text-align:center;
  text-transform:uppercase; letter-spacing:.6px;}
.m-item{
  font-weight:800; font-size:.95rem; padding:12px 10px; border-radius:18px; cursor:pointer;
  background:var(--white); border:4px solid #f0e7f7; box-shadow:0 5px 0 rgba(122,83,214,.1);
  text-align:center; transform-origin:center bottom; transition:border-color .18s ease;
  color:var(--ink); line-height:1.2;
}
.m-item.en{font-family:var(--font-fun); color:var(--lilac-deep); font-size:1.02rem;}
.m-item.sel{border-color:var(--pink); background:var(--pink-soft);}
.m-item.matched{border-color:var(--mint); background:var(--mint-soft); color:var(--mint-deep); cursor:default;
  box-shadow:0 5px 0 rgba(31,156,106,.25);}
.m-item.bad{animation:shakeNo .45s ease both; border-color:var(--coral); background:#ffeae5;}

/* ============ GAPS (frases com lacuna) ============ */
.gap-row{
  background:var(--white); border:4px solid #f0e7f7; border-radius:20px; padding:13px 15px; margin-bottom:11px;
  box-shadow:0 5px 0 rgba(122,83,214,.1);
}
.gap-row.solved{border-color:var(--mint); background:var(--mint-soft); box-shadow:0 5px 0 rgba(31,156,106,.22);}
.gap-row .sent{font-weight:800; font-size:1rem; margin-bottom:9px; line-height:1.45;}
.gap-row .sent .blank{display:inline-block; min-width:92px; border-bottom:4px dotted var(--lilac);
  text-align:center; color:var(--lilac-deep); font-family:var(--font-fun);}
.gap-row .sent .blank.filled{border-bottom-color:var(--mint-deep); color:var(--mint-deep);}
.gap-row .mini-opts{display:flex; gap:7px; flex-wrap:wrap;}
.mini{
  font-family:var(--font-fun); font-weight:800; font-size:.92rem; padding:9px 14px; border-radius:16px;
  background:var(--lilac-soft); border:3px solid var(--white); color:var(--lilac-deep); cursor:pointer;
  box-shadow:0 4px 0 rgba(122,83,214,.16); transform-origin:center bottom; transition:filter .18s ease;
}
.mini:hover:not([disabled]){filter:brightness(1.05);}
.mini.ok{background:var(--mint); color:#0c5c3d; box-shadow:0 4px 0 rgba(31,156,106,.35);}
.mini.no{background:#ffcfc5; color:#6d2010; animation:shakeNo .45s ease both;}
.mini[disabled]{cursor:default; opacity:.55;}

   ============================================================ */
const Sound = (() => {
  let ctx = null;
  const on = () => { try { if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state === 'suspended') ctx.resume(); return ctx; } catch(e){ return null; } };

  function tone(freq, dur, type, vol, slideTo, delay){
    const c = on(); if(!c) return;
    const t0 = c.currentTime + (delay||0);
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if(slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(40,slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.16, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }

  return {
    unlockAudio: on,
    /* pop fofo de apertar squishy */
    pop(){ tone(760, 0.1, 'sine', 0.2, 300); tone(1500, 0.05, 'triangle', 0.06, 900, 0.01); },
    /* clique macio de botão */
    click(){ tone(520, 0.07, 'sine', 0.13, 340); },
    /* apertou um squishy da prateleira (mais longo e borrachudo) */
    squish(){ tone(300, 0.17, 'sine', 0.2, 820); tone(880, 0.1, 'triangle', 0.07, 420, 0.06); },

    correct(){ [[659,0],[784,0.09],[988,0.18],[1319,0.27]].forEach(([f,d]) => tone(f,0.22,'sine',0.14,null,d)); },
    /* errou - blip gentil, nada assustador */
    wrong(){ tone(330, 0.16, 'triangle', 0.11, 250); tone(247, 0.2, 'sine', 0.1, 200, 0.1); },
    /* desbloqueou squishy - chuvinha de estrelinhas */
    unlock(){ [[523,0],[659,0.07],[784,0.14],[1047,0.21],[1319,0.3],[1568,0.4]]
      .forEach(([f,d]) => tone(f,0.3,'triangle',0.12,null,d)); },
    /* fim de fase */
    fanfare(){ [[523,0],[523,0.12],[784,0.24],[1047,0.4],[1319,0.56]]
      .forEach(([f,d]) => tone(f,0.4,'sine',0.14,null,d)); }

})();

const ALL_QUESTIONS = FASES.flatMap(f => f.questions.map(q => ({...q, fase:f.id})));
const TOTAL_Q = ALL_QUESTIONS.length;

/* ============================================================
   6. ESTADO + LOCALSTORAGE
   ============================================================ */
const LS_KEY = 'squishy_english_damas_v1';
const PIN = '1234';

function defaultState(){
  return { name:'', records:{}, done:[], unlocked:[], streak:0, bestStreak:0,
           started:null, updated:null, rounds:0 };
}
let S = defaultState();

function save(){
  S.updated = new Date().toISOString();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){ /* modo privado */ }
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const o = JSON.parse(raw); if(o && typeof o === 'object') S = Object.assign(defaultState(), o); }
  }catch(e){ S = defaultState(); }
}

/* totais de itens avaliados por tópico (para o relatório) */
const TOPIC_TOTALS = (() => {
  const t = { voc8:0, fable:0, gram:0, voc9:0 };
  ALL_QUESTIONS.forEach(q => {
    const n = q.type === 'match' ? q.pairs.length
            : q.type === 'gaps'  ? q.rows.length
            : q.type === 'multi' ? q.options.length : 1;
    t[q.topic] += n;
  });
  return t;
})();

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function recordItem(qid, topic, item, ok){
  S.records[qid + '::' + item] = { qid, topic, item, firstTry:!!ok };
  if(ok){ S.streak++; if(S.streak > S.bestStreak) S.bestStreak = S.streak; }
  else { S.streak = 0; }
  save();
}
function clearQuestionRecords(qid){
  Object.keys(S.records).forEach(k => { if(S.records[k].qid === qid) delete S.records[k]; });
}
const firstTryCount = () => Object.values(S.records).filter(r => r.firstTry).length;
const faseDone = f => f.questions.every(q => S.done.includes(q.id));
const faseUnlocked = i => i === 0 || faseDone(FASES[i-1]);

/* ============================================================
   7. DESBLOQUEIO DE SQUISHIES
   ============================================================ */
function unlockRules(){
  return {
    alien:   firstTryCount() >= 1,
    web:     S.bestStreak >= 5,
    star:    faseDone(FASES[0]),
    crown:   S.bestStreak >= 10,
    sweater: faseDone(FASES[1]),
    shell:   firstTryCount() >= 25,
    snow:    faseDone(FASES[2]),
    mask:    S.done.length >= TOTAL_Q
  };
}
function checkUnlocks(){
  const rules = unlockRules(), fresh = [];
  SQUISHY_ORDER.forEach(({id}) => {
    if(rules[id] && !S.unlocked.includes(id)){ S.unlocked.push(id); fresh.push(id); }
  });
  if(fresh.length) save();
  return fresh;
}

function screenQuiz(faseIdx, qIdx){
  const fase = FASES[faseIdx];
  if(qIdx >= fase.questions.length) return screenFaseEnd(faseIdx);

  const q = fase.questions[qIdx];
  const globalNum = ALL_QUESTIONS.findIndex(x => x.id === q.id) + 1;
  clearQuestionRecords(q.id);            /* refazer = medir de novo */
  S.done = S.done.filter(id => id !== q.id);
  save();

  const topic = TOPICS[q.topic];
  app().innerHTML = `
  ${topbarHTML(true)}
  <div class="card" id="qcard">
    <div class="qhead">
      <span class="qtag ${topic.cls}">${fase.emoji} ${topic.label}</span>
      <span class="qnum">Questão ${globalNum} de ${TOTAL_Q}</span>
    </div>
    ${q.story ? `<div class="story">${q.story}</div>` : ''}
    ${q.scene ? `<div class="scene"><span class="av">${q.scene.av}</span>
       <span class="txt">${q.scene.txt}</span></div>` : ''}
    <p class="question">${q.prompt}</p>
    <div id="body"></div>
    <div id="fb"></div>
    <div class="qfoot">
      <button class="sq ghost" id="backBtn">⬅ Mapa</button>
      <button class="sq mint" id="nextBtn" style="display:none">
        ${qIdx + 1 >= fase.questions.length ? 'Terminar a fase 🎉' : 'Próxima ➡'}</button>
    </div>
  </div>`;

  document.getElementById('backBtn').addEventListener('click', () => screenHub());
  document.getElementById('nextBtn').addEventListener('click', () => {
    const newly = checkUnlocks();
    if(newly.length) showUnlockQueue(newly, () => screenQuiz(faseIdx, qIdx + 1));
    else screenQuiz(faseIdx, qIdx + 1);
  });

  const renderers = { mc:renderMC, match:renderMatch, gaps:renderGaps, multi:renderMulti };
  renderers[q.type](q, document.getElementById('body'), () => finishQuestion(q));
  wireGear();
  window.scrollTo({top:0, behavior:'smooth'});
}

function finishQuestion(q){
  if(!S.done.includes(q.id)) S.done.push(q.id);

  Sound.correct();

/* ---------- 12a. MÚLTIPLA ESCOLHA ---------- */
function renderMC(q, box, done){
  let attempts = 0;
  const keys = ['A','B','C','D','E'];
  box.innerHTML = `<div class="options">${
    shuffle(q.options.map((o, i) => ({...o, i}))).map((o, n) => `
      <button class="opt" data-i="${o.i}">
        <span class="key">${keys[n]}</span>
        <span class="lbl">${o.en}${o.pt?`<span class="pt">${o.pt}</span>`:''}</span>
      </button>`).join('')}</div>`;

  box.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => {
      if(btn.disabled) return;
      const o = q.options[+btn.dataset.i];
      if(o.correct){
        recordItem(q.id, q.topic, q.item, attempts === 0);
        btn.classList.add('correct');
        box.querySelectorAll('.opt').forEach(b => { b.disabled = true; if(b !== btn) b.classList.add('faded'); });
        done();
      } else {
        if(attempts === 0) recordItem(q.id, q.topic, q.item, false);
        attempts++;
        btn.classList.add('wrong'); btn.disabled = true;
        Sound.wrong();
        showFeedback(false, q.wrongFeedback || 'Essa não é a palavra certa. Leia a frase devagar e tente outra opção! 💛');
        if(q.tipTopic) showTip(q.tipTopic);
      }
    });
  });
}

/* ---------- 12b. LIGAR COLUNAS (match) ---------- */
function renderMatch(q, box, done){
  const lefts = shuffle(q.pairs), rights = shuffle(q.pairs);
  const wrongOnce = new Set();
  let sel = null, matched = 0;

  box.innerHTML = `
  <div class="match-wrap">
    <div class="match-col"><h5>English</h5>${
      lefts.map(p => `<button class="m-item en" data-en="${esc(p.en)}">${esc(p.en)}</button>`).join('')}</div>
    <div class="match-col"><h5>Português</h5>${
      rights.map(p => `<button class="m-item" data-for="${esc(p.en)}">${esc(p.pt)}</button>`).join('')}</div>
  </div>
  <p class="progress-label" style="text-align:left;margin-top:10px" id="mcount">0 de ${q.pairs.length} ligados</p>`;

  const upd = () => document.getElementById('mcount').textContent = `${matched} de ${q.pairs.length} ligados`;

  box.querySelectorAll('.m-item.en').forEach(b => b.addEventListener('click', () => {
    if(b.classList.contains('matched')) return;
    box.querySelectorAll('.m-item.en').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel'); sel = b;
  }));

  box.querySelectorAll('.m-item[data-for]').forEach(b => b.addEventListener('click', () => {
    if(b.classList.contains('matched')) return;
    if(!sel){ toast('Escolha primeiro uma palavra em inglês! 👉'); return; }
    const en = sel.dataset.en, pair = q.pairs.find(p => p.en === en);
    if(b.dataset.for === en){
      recordItem(q.id, q.topic, pair.item, !wrongOnce.has(en));
      sel.classList.remove('sel'); sel.classList.add('matched'); b.classList.add('matched');
      Sound.pop(); sel = null; matched++; upd();
      if(matched === q.pairs.length) done();
    } else {
      wrongOnce.add(en);
      const other = q.pairs.find(p => p.en === b.dataset.for);
      recordItem(q.id, q.topic, pair.item, false);
      b.classList.add('bad'); Sound.wrong();
      setTimeout(() => b.classList.remove('bad'), 480);
      showFeedback(false, `<span class="en-word">${esc(en)}</span> não significa &ldquo;${esc(other.pt)}&rdquo;.
        Tente outra ligação — leia com calma e pense na palavra! 💛`);
    }
  }));
}

/* ---------- 12c. LACUNAS (gaps) ---------- */
function renderGaps(q, box, done){
  let solved = 0;
  const sentHTML = r => r.sent.includes('___')
    ? r.sent.replace('___', '<span class="blank">______</span>')
    : r.sent + ' &nbsp;<span class="blank">______</span>';
  box.innerHTML = q.rows.map((r, i) => `
    <div class="gap-row" data-row="${i}">
      <div class="sent">${sentHTML(r)}</div>
      <div class="mini-opts">${shuffle(r.opts.map((o,j)=>({...o,j})))
        .map(o => `<button class="mini" data-j="${o.j}">${o.t}</button>`).join('')}</div>
      <div class="pt-hint" style="display:none"></div>
    </div>`).join('');

  box.querySelectorAll('.gap-row').forEach(row => {
    const i = +row.dataset.row, r = q.rows[i];
    let attempts = 0;
    row.querySelectorAll('.mini').forEach(btn => btn.addEventListener('click', () => {
      if(btn.disabled || row.classList.contains('solved')) return;
      const o = r.opts[+btn.dataset.j];
      if(o.ok){
        recordItem(q.id, q.topic, r.item, attempts === 0);
        btn.classList.add('ok'); row.classList.add('solved');
        row.querySelectorAll('.mini').forEach(x => x.disabled = true);
        const bl = row.querySelector('.blank');
        if(bl){ bl.textContent = o.t; bl.classList.add('filled'); }
        Sound.pop();
        solved++;
        if(solved === q.rows.length) done();
      } else {
        if(attempts === 0) recordItem(q.id, q.topic, r.item, false);
        attempts++;
        btn.classList.add('no'); btn.disabled = true; Sound.wrong();
        const h = row.querySelector('.pt-hint');
        h.style.display = ''; h.innerHTML = '💡 ' + r.hint;
        showFeedback(false, 'Leia a dica 💡 que apareceu embaixo da frase e escolha outra opção!');
        if(q.tipTopic) showTip(q.tipTopic);
      }
    }));
  });
}

/* ---------- 12d. MULTISSELEÇÃO (stylist challenge) ---------- */
function renderMulti(q, box, done){
  let attempts = 0;
  const picked = new Set();
  box.innerHTML = `
  <div class="options grid2">${shuffle(q.options.map((o,i)=>({...o,i})))
    .map(o => `<button class="opt chip" data-i="${o.i}">
        <span class="ico">${o.ico||'✨'}</span>
        <span class="lbl">${o.en}${o.pt?`<span class="pt">${o.pt}</span>`:''}</span>
      </button>`).join('')}</div>
  <div style="text-align:center;margin-top:14px">
    <button class="sq lilac" id="checkBtn">Conferir o look 👗</button></div>`;

  const chips = [...box.querySelectorAll('.opt.chip')];
  chips.forEach(c => c.addEventListener('click', () => {
    if(c.disabled) return;
    const i = +c.dataset.i;
    if(picked.has(i)){ picked.delete(i); c.classList.remove('picked'); }
    else { picked.add(i); c.classList.add('picked'); }
  }));

  document.getElementById('checkBtn').addEventListener('click', () => {
    const need = q.options.filter(o => o.correct).length;
    if(picked.size !== need){ toast(`Escolha exatamente ${need} peças! 👗`); Sound.wrong(); return; }
    const perfect = q.options.every((o, i) => !!o.correct === picked.has(i));
    if(perfect){
      q.options.forEach(o => recordItem(q.id, q.topic, o.item, attempts === 0));
      chips.forEach(c => { c.disabled = true; c.classList.remove('picked');
        if(q.options[+c.dataset.i].correct) c.classList.add('correct');
        else c.classList.add('faded'); });
      document.getElementById('checkBtn').remove();
      done();
    } else {
      if(attempts === 0){
        q.options.forEach((o, i) => recordItem(q.id, q.topic, o.item, !!o.correct === picked.has(i)));
      }
      attempts++;
      Sound.wrong();
      chips.forEach(c => {
        const i = +c.dataset.i, o = q.options[i];
        if(picked.has(i) && !o.correct){ c.classList.add('wrong'); c.classList.remove('picked'); }
      });
      picked.forEach(i => { if(!q.options[i].correct) picked.delete(i); });
      setTimeout(() => chips.forEach(c => c.classList.remove('wrong')), 600);
      showFeedback(false, q.wrongFeedback || 'Algumas peças não combinam com essa situação. Tente de novo! 💛');
    }
  });
}

/* ============================================================
   13. POPUP DE SQUISHY DESBLOQUEADO
   ============================================================ */
function showUnlockQueue(ids, after){
  if(!ids.length){ after && after(); return; }
  const id = ids[0], sq = SQUISHIES[id];
  Sound.unlock();
  overlays().innerHTML = `
  <div class="overlay" id="ov">
    <div class="modal">
      <div class="sparkles">
        <span style="left:6%;top:6px">✨</span><span style="right:8%;top:14px">⭐</span>
        <span style="left:16%;top:96px">💖</span><span style="right:14%;top:104px">✨</span>
      </div>
      <p style="font-weight:800;color:#e5569b;margin:0">NOVO SQUISHY DESBLOQUEADO!</p>
      <h3>${esc(sq.name)}</h3>
      <div class="bigsquishy" id="bigsq">${sq.svg}</div>
      <p>${esc(sq.hint)}<br><small>Aperte o squishy para ouvir o pop! 🫧</small></p>
      <button class="sq primary" id="okSq">Guardar na prateleira 🧸</button>
    </div>
  </div>`;
  document.getElementById('bigsq').addEventListener('click', () => {});
  document.getElementById('okSq').addEventListener('click', () => {
    overlays().innerHTML = '';
    showUnlockQueue(ids.slice(1), after);
  });
}

/* ============================================================
   14. FIM DE FASE
   ============================================================ */
function screenFaseEnd(faseIdx){
  const fase = FASES[faseIdx];
  const newly = checkUnlocks();
  Sound.fanfare();

  const stats = faseStats(fase);
  const isLast = faseIdx === FASES.length - 1;
  const allDone = S.done.length >= TOTAL_Q;

  app().innerHTML = `
  ${topbarHTML(true)}
  <div class="card result">
    <h2>Fase ${fase.id} completa! ${fase.emoji}🎉</h2>
    <p style="font-weight:700;color:#7b6a84;margin:0">
      Parabéns, ${esc(S.name || 'estrelinha')}! Você terminou <b>${esc(fase.title)}</b>.</p>
    <div class="score-ring" style="--pc:${stats.pct}">
      <div class="inner"><b>${stats.pct}%</b><span>DE PRIMEIRA</span></div>
    </div>
    <p style="font-weight:800;color:#7b6a84;margin:0 0 6px">
      ${stats.ok} de ${stats.total} itens acertados na primeira tentativa</p>
    <p style="font-weight:700;color:#7b6a84;font-size:.9rem">🔥 Melhor sequência: ${S.bestStreak} acertos seguidos</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px">
      <button class="sq ghost" id="againBtn">Refazer a fase 🔁</button>
      ${isLast && allDone
        ? `<button class="sq butter" id="finalBtn2">Ver meu boletim 🏆</button>`
        : `<button class="sq primary" id="nextFase">${isLast?'Voltar ao mapa 🗺️':'Próxima fase ➡'}</button>`}
    </div>
    ${shelfHTML(newly)}
  </div>`;

  document.getElementById('againBtn').addEventListener('click', () => screenQuiz(faseIdx, 0));
  const nf = document.getElementById('nextFase');
  if(nf) nf.addEventListener('click', () => {
    if(isLast) screenHub();
    else if(faseUnlocked(faseIdx+1)) screenQuiz(faseIdx+1, 0);
    else screenHub();
  });
  const f2 = document.getElementById('finalBtn2');
  if(f2) f2.addEventListener('click', () => screenFinal());

  bindShelf(); wireGear();
  if(newly.length) showUnlockQueue(newly, null);
  window.scrollTo({top:0, behavior:'smooth'});
}

function faseStats(fase){
  const ids = fase.questions.map(q => q.id);
  const rs = Object.values(S.records).filter(r => ids.includes(r.qid));
  const ok = rs.filter(r => r.firstTry).length;
  return { ok, total:rs.length, pct: rs.length ? Math.round(ok/rs.length*100) : 0 };
}
function topicStats(){
  const out = {};
  Object.keys(TOPICS).forEach(k => {
    const rs = Object.values(S.records).filter(r => r.topic === k);
    const ok = rs.filter(r => r.firstTry).length;
    out[k] = { ok, answered:rs.length, total:TOPIC_TOTALS[k],
               pct: rs.length ? Math.round(ok/rs.length*100) : 0,
               missed: rs.filter(r => !r.firstTry).map(r => r.item) };
  });
  return out;
}

/* ============================================================
   15. BOLETIM FINAL DA ALUNA
   ============================================================ */
function screenFinal(){
  const ts = topicStats();
  const all = Object.values(S.records);
  const ok = all.filter(r => r.firstTry).length;
  const pct = all.length ? Math.round(ok/all.length*100) : 0;
  const msg = pct >= 90 ? 'Você está prontíssima para a prova! 🌟'
            : pct >= 70 ? 'Muito bom! Só falta treinar as palavrinhas marcadas. 💪'
            : 'Boa! Vamos repetir as fases para fixar o vocabulário. Você consegue! 💕';

  const bars = Object.entries(ts).map(([k,v]) => `
    <div class="tbar">
      <div class="tl"><span>${TOPICS[k].label}</span><span>${v.pct}%</span></div>
      <div class="tt"><div class="tf" style="width:${v.pct}%;background:${TOPICS[k].color}"></div></div>
    </div>`).join('');

  const toReview = [...new Set(all.filter(r => !r.firstTry).map(r => r.item))];

  app().innerHTML = `
  ${topbarHTML(true)}
  <div class="card result">
    <h2>Boletim Fofo de ${esc(S.name || 'Estrelinha')} 🏆</h2>
    <div class="score-ring" style="--pc:${pct}">
      <div class="inner"><b>${pct}%</b><span>DE PRIMEIRA</span></div>
    </div>
    <p style="font-weight:800;color:#7b6a84;margin:0 0 4px">${ok} de ${all.length} itens de primeira tentativa</p>
    <p style="font-weight:700;color:#7b6a84;font-size:.95rem">${msg}</p>
    <div class="topic-bars">${bars}</div>
    ${toReview.length ? `
      <h4 style="font-family:var(--font-fun);margin:18px 0 8px;font-size:1.05rem;text-align:left">
        📌 Palavras e regras para dar uma olhadinha antes da prova:</h4>
      <ul class="miss-list">${toReview.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`
    : `<p style="font-weight:800;color:#1f9c6a;margin-top:14px">
        🎉 Você acertou tudo de primeira! Que orgulho!</p>`}
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px">
      <button class="sq ghost" id="hubBtn">Voltar ao mapa 🗺️</button>
      <button class="sq primary" id="redoBtn">Treinar tudo de novo 🔁</button>
    </div>
    ${shelfHTML()}
  </div>`;

  document.getElementById('hubBtn').addEventListener('click', () => screenHub());
  document.getElementById('redoBtn').addEventListener('click', () => {
    S.rounds = (S.rounds||0) + 1; S.done = []; S.records = {}; S.streak = 0; save();
    toast('Simulado reiniciado! Os squishies ficam com você 🧸');
    screenHub();
  });
  bindShelf(); wireGear();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ============================================================
   16. ÁREA SECRETA DA PROFESSORA (senha 1234)
   ============================================================ */
function wireGear(){
  const g = document.getElementById('gearBtn');
  if(g) g.addEventListener('click', openTeacherLock);
}

function openTeacherLock(){
  overlays().innerHTML = `
  <div class="overlay teacher" id="ov">
    <div class="modal lockbox">
      <h3>🔐 Área da Professora</h3>
      <p>Digite a senha de acesso para ver o relatório de desempenho.</p>
      <input class="pin-field" id="pinInput" type="password" inputmode="numeric"
        maxlength="4" placeholder="••••" autocomplete="off">
      <p id="pinMsg" style="color:#e2573c;min-height:20px;margin:10px 0 0;font-size:.85rem"></p>
      <div class="t-actions">
        <button class="sq ghost" id="pinCancel">Fechar</button>
        <button class="sq lilac" id="pinOk">Entrar</button>
      </div>
    </div>
  </div>`;
  const inp = document.getElementById('pinInput');
  const tryPin = () => {
    if(inp.value === PIN){ Sound.correct(); openTeacherReport(); }
    else { Sound.wrong(); document.getElementById('pinMsg').textContent = 'Senha incorreta. Tente novamente.';
      inp.value = ''; inp.focus(); squish(inp); }
  };
  document.getElementById('pinOk').addEventListener('click', tryPin);
  document.getElementById('pinCancel').addEventListener('click', () => overlays().innerHTML = '');
  inp.addEventListener('keydown', e => { if(e.key === 'Enter') tryPin(); });
  inp.focus();
}

function openTeacherReport(){
  const ts = topicStats();
  const all = Object.values(S.records);
  const okAll = all.filter(r => r.firstTry).length;
  const pctAll = all.length ? Math.round(okAll/all.length*100) : 0;
  const upd = S.updated ? new Date(S.updated).toLocaleString('pt-BR') : '—';
  const fmt = d => d ? new Date(d).toLocaleString('pt-BR') : '—';

  const blocks = Object.entries(ts).map(([k,v]) => {
    const missed = [...new Set(v.missed)];
    return `
    <h4>${TOPICS[k].label} — <span style="color:${TOPICS[k].color}">${v.pct}%</span>
      <small style="color:#7b6a84;font-weight:700">(${v.ok}/${v.answered} de primeira · ${v.total} itens no total)</small></h4>
    <div class="tbar" style="margin-bottom:8px">
      <div class="tt"><div class="tf" style="width:${v.pct}%;background:${TOPICS[k].color}"></div></div>
    </div>
    <ul class="miss-list">${
      v.answered === 0 ? `<li class="none" style="background:#f3eefa;border-color:#ddd3e4;color:#7b6a84">
        ainda não respondido</li>`
      : missed.length ? missed.map(m => `<li>${esc(m)}</li>`).join('')
      : `<li class="none">✓ nenhum erro de primeira tentativa</li>`}</ul>`;
  }).join('');

  const faseRows = FASES.map(f => {
    const st = faseStats(f), nDone = f.questions.filter(q => S.done.includes(q.id)).length;
    return `<span class="pill">${f.emoji} Fase ${f.id}: ${nDone}/${f.questions.length} · ${st.pct}%</span>`;
  }).join('');

  overlays().innerHTML = `
  <div class="overlay teacher" id="ov">
    <div class="modal treport">
      <h3>📊 Relatório de Desempenho</h3>
      <div class="meta">
        <span class="pill p-pink">👧 ${esc(S.name || '—')}</span>
        <span class="pill p-blue">✅ ${pctAll}% geral (${okAll}/${all.length})</span>
        <span class="pill">🧸 ${S.unlocked.length}/${SQUISHY_ORDER.length} squishies</span>
        <span class="pill">🔥 melhor sequência: ${S.bestStreak}</span>
      </div>
      <div class="meta">${faseRows}</div>
      <p style="font-size:.78rem;font-weight:700;color:#7b6a84;margin:4px 0 0">
        Início: ${fmt(S.started)} · Última atividade: ${upd} · Simulados reiniciados: ${S.rounds||0}</p>
      <p style="font-size:.82rem;font-weight:700;color:#7b6a84;background:#f6f1fb;border-radius:14px;padding:10px 12px;margin:12px 0 0">
        ℹ️ As porcentagens consideram apenas a <b>primeira tentativa</b> de cada item.
        As etiquetas vermelhas são exatamente as palavras/regras que a aluna errou de primeira — use-as como roteiro da revisão final.</p>
      ${blocks}
      <div class="t-actions">
        <button class="sq ghost" id="tClose">Fechar</button>
        <button class="sq blue" id="tCopy">Copiar relatório 📋</button>
        <button class="sq danger" id="tReset">Resetar dados 🗑️</button>
      </div>
    </div>
  </div>`;

  document.getElementById('tClose').addEventListener('click', () => overlays().innerHTML = '');

  document.getElementById('tCopy').addEventListener('click', () => {
    let txt = `RELATÓRIO - Revisão de Inglês (Units 8 e 9)\nAluna: ${S.name||'—'}\n`+
      `Desempenho geral (1ª tentativa): ${pctAll}% (${okAll}/${all.length})\n`+
      `Melhor sequência: ${S.bestStreak} · Squishies: ${S.unlocked.length}/${SQUISHY_ORDER.length}\n`+
      `Última atividade: ${upd}\n\n`;
    Object.entries(ts).forEach(([k,v]) => {
      const missed = [...new Set(v.missed)];
      txt += `${TOPICS[k].label}: ${v.pct}% (${v.ok}/${v.answered} de ${v.total} itens)\n`;
      txt += missed.length ? `  Errou de 1ª: ${missed.join('; ')}\n\n` : `  Sem erros de 1ª tentativa\n\n`;
    });
    const done = () => toast('Relatório copiado! 📋');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
    } else fallbackCopy(txt, done);
  });

  document.getElementById('tReset').addEventListener('click', () => {
    const m = document.querySelector('.treport');
    m.insertAdjacentHTML('beforeend', `
      <div class="feedback bad" id="confirmBox">
        <div class="fh">⚠️ Resetar todos os dados?</div>
        <div>Isso apaga o nome, as porcentagens, os erros registrados e os squishies desbloqueados
          deste navegador. Não dá para desfazer.</div>
        <div class="t-actions">
          <button class="sq ghost" id="cNo">Cancelar</button>
          <button class="sq danger" id="cYes">Sim, resetar tudo</button>
        </div>
      </div>`);
    document.getElementById('cNo').addEventListener('click', () => document.getElementById('confirmBox').remove());
    document.getElementById('cYes').addEventListener('click', () => {
      S = defaultState();
      try{ localStorage.removeItem(LS_KEY); }catch(e){}
      overlays().innerHTML = '';
      toast('Dados resetados. Pronto para um novo simulado! ✨');
      screenWelcome();
    });
  });
}

function fallbackCopy(txt, cb){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){ toast('Não foi possível copiar.'); }
  ta.remove();
}

/* fecha overlay clicando fora do cartão */
document.addEventListener('click', e => {
  if(e.target.id === 'ov' && !e.target.querySelector('#pinInput, #bigsq')) overlays().innerHTML = '';
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') overlays().innerHTML = '';
});

/* ============================================================
   17. BOOT
   ============================================================ */
load();
if(S.name && S.done.length) screenHub(); else screenWelcome();
</script>
